name: Deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - "playbook.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        env:
          PLAYBOOK_TOKEN: ${{ secrets.PLAYBOOK_TOKEN }}
          PLAYBOOK_PIN: ${{ secrets.PLAYBOOK_PIN }}
        run: |
          mkdir -p site
          cp index.html app.js plays.js playbook.json playbook-data.js pack-assets.js cloud.js sw.js manifest.json robots.txt OPEN-ME.txt .nojekyll site/
          python3 - <<'PY'
          import json, os, pathlib, re
          cfg = {
            "owner": "chat-blip",
            "repo": "raiders-play-designer",
            "path": "playbook.json",
            "token": os.environ.get("PLAYBOOK_TOKEN") or "",
            "pin": os.environ.get("PLAYBOOK_PIN") or "",
          }
          open("site/cloud-config.js", "w", encoding="utf-8").write(
              "window.RAIDERS_CLOUD = " + json.dumps(cfg) + ";\n"
          )
          stamp = os.environ.get("GITHUB_RUN_ID") or "dev"
          html = pathlib.Path("site/index.html")
          text = re.sub(r'\?v=[^"]+', "?v=run" + stamp, html.read_text(encoding="utf-8"))
          text = re.sub(r'data-build="[^"]*"', 'data-build="run' + stamp + '"', text)
          html.write_text(text, encoding="utf-8")
          pathlib.Path("site/play.html").write_text(text, encoding="utf-8")
          pathlib.Path("site/go.html").write_text(text, encoding="utf-8")
          pathlib.Path("site/coach.html").write_text(text, encoding="utf-8")
          pathlib.Path("site/open.html").write_text(text, encoding="utf-8")
          pathlib.Path("site/forms.html").write_text(text, encoding="utf-8")
          pathlib.Path("site/edit.html").write_text(text, encoding="utf-8")
          pathlib.Path("site/version.json").write_text(
              json.dumps({"build": "run" + stamp}) + "\n",
              encoding="utf-8",
          )
          print("cloud_token_len", len(cfg["token"]))
          print("cloud_pin_len", len(cfg["pin"]))
          print("build", "run" + stamp)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
